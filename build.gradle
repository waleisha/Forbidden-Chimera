// Root build. The 1.20.1 line mirrors the 26.3 project's multi-loader layout:
//   common/  loader independent logic, no mod entry point
//   forge/   the Forge entry point, registration, client wiring and the mixin config
//
// Why a separate `common` from the 26.3 one: the two Minecraft versions are three years and a dozen
// minor releases apart. `Identifier`, `ValueInput`/`ValueOutput`, data components and the render-state
// pipeline simply do not exist in 1.20.1, so the same source cannot compile against both. Each
// Minecraft line therefore carries its own common module, which is the usual arrangement for a mod
// that supports several major versions at once.
plugins {
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
    id 'org.spongepowered.mixin' version '0.7.38' apply false
}
