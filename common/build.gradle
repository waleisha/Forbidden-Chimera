plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle'
}

version = mod_version
group = mod_group_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    // ForgeGradle requires a `minecraft` dependency to configure at all, even in a module that only
    // compiles against it. `compileOnly` keeps Forge off this module's runtime classpath: the shared
    // logic here deliberately imports nothing from net.minecraftforge, so it stays loader agnostic and
    // could be reused by a Fabric or NeoForge module later.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")

    // Both loaders bundle Mixin; Forge ships it too, so the annotations are safe here.
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
